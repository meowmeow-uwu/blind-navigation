services:
  web-dashboard:
    build: .
    container_name: blindnav_dashboard
    ports:
      - "8088:8088"
    volumes:
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: blindnav_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    command: mosquitto -c /mosquitto-no-auth.conf
    restart: unless-stopped
