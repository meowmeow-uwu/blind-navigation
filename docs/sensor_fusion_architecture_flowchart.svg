<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gf-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gf-cam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="gf-us" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gf-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gf-matrix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gf-kf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gf-out" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="f-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Markers -->
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-gr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="url(#gf-title)">SƠ ĐỒ HỢP NHẤT CẢM BIẾN ĐA PHƯƠNG THỨC (MULTIMODAL FUSION)</text>
  <text x="500" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Kết hợp Camera đơn &amp; Cảm biến Siêu âm HC-SR04 • Lọc Kalman DWNA Joseph • Tự học thang đo</text>

  <!-- ================= 1. HAI NGUỒN CẢM BIẾN ĐẦU VÀO ================= -->
  <!-- Nguồn 1: Camera Tracks -->
  <g filter="url(#f-shadow)">
    <rect x="80" y="80" width="380" height="65" rx="8" fill="url(#gf-cam)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="270" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CAMERA RGB (ĐÃ QUA TRACKING)</text>
    <text x="270" y="123" text-anchor="middle" font-size="11" fill="#e0f2fe">• Ground-plane IPM: d = h / tan(α + θ_y)</text>
    <text x="270" y="137" text-anchor="middle" font-size="10" fill="#bae6fd">• Pinhole Fallback khi chạm đáy ảnh hoặc vật treo</text>
  </g>

  <!-- Nguồn 2: Siêu âm HC-SR04 -->
  <g filter="url(#f-shadow)">
    <rect x="540" y="80" width="380" height="65" rx="8" fill="url(#gf-us)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="730" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CẢM BIẾN SIÊU ÂM HC-SR04 (40 kHz)</text>
    <text x="730" y="123" text-anchor="middle" font-size="11" fill="#fef3c7">• Khoảng cách vật lý thô z_us (chuẩn ±1cm)</text>
    <text x="730" y="137" text-anchor="middle" font-size="10" fill="#fde68a">• Búp sóng nón góc mở toàn phần 30° (θ_half = 15°)</text>
  </g>

  <!-- Mũi tên dẫn xuống Khối Kiểm tra Chùm Nón -->
  <path d="M 270 145 L 270 180 L 450 180 L 450 195" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 730 145 L 730 180 L 550 180 L 550 195" fill="none" stroke="#fbbf24" stroke-width="2"/>

  <!-- ================= 2. KIỂM TRA CHÙM SÓNG NÓN & GÁN ECHO ================= -->
  <g filter="url(#f-shadow)">
    <rect x="250" y="195" width="500" height="68" rx="10" fill="url(#gf-beam)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="500" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">PHÂN VÙNG BÚP SÓNG 30° &amp; GÁN PHẢN XẠ GẦN NHẤT</text>
    <text x="500" y="236" text-anchor="middle" font-size="11" fill="#e0e7ff">• Điều kiện lọt chùm nón: Góc lệch ngang θ_x = |arctan((cx - cx_cam)/fx)| ≤ 15°</text>
    <text x="500" y="251" text-anchor="middle" font-size="11" fill="#c7d2fe">• Nguyên lý sóng âm: Gán số đo z_us cho vật có d_cam GẦN NHẤT trong chùm</text>
  </g>

  <!-- Phân 2 nhánh từ chùm sóng -->
  <path d="M 380 263 L 380 295 L 230 295 L 230 320" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr-g)"/>
  <path d="M 620 263 L 620 295 L 620 320" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Nhãn rẽ nhánh -->
  <rect x="150" y="285" width="160" height="20" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="230" y="299" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8">Vật NGOÀI chùm nón (θ_x &gt; 15°)</text>

  <rect x="540" y="285" width="160" height="20" rx="4" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
  <text x="620" y="299" text-anchor="middle" font-size="10" font-weight="700" fill="#e9d5ff">Vật TRONG chùm nón (θ_x ≤ 15°)</text>

  <!-- Khối vật ngoài chùm: Dùng camera x scale -->
  <g filter="url(#f-shadow)">
    <rect x="110" y="320" width="240" height="52" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <text x="230" y="341" text-anchor="middle" font-size="12" font-weight="700" fill="#cbd5e1">NGOÀI CHÙM SIÊU ÂM</text>
    <text x="230" y="358" text-anchor="middle" font-size="10" fill="#94a3b8">d = d_cam × s (đã tự học thang đo)</text>
  </g>

  <!-- ================= 3. MA TRẬN XỬ LÝ XUNG ĐỘT 4 KỊCH BẢN ================= -->
  <g filter="url(#f-shadow)">
    <rect x="420" y="320" width="460" height="120" rx="10" fill="url(#gf-matrix)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="650" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">MA TRẬN XỬ LÝ XUNG ĐỘT 4 KỊCH BẢN VẬT LÝ</text>
    
    <text x="440" y="365" font-size="11" font-weight="600" fill="#a7f3d0">KB 1: Đồng thuận (δ ≤ 25%)</text>
    <text x="635" y="365" font-size="10" fill="#f1f5f9">→ Cập nhật siêu âm R_us=0.0025, kích hoạt tự học thang đo s</text>
    
    <text x="440" y="385" font-size="11" font-weight="600" fill="#fde68a">KB 2: Tiêu âm / Xiên góc (z_us &gt; 1.25 d_cam)</text>
    <text x="705" y="385" font-size="10" fill="#f1f5f9">→ Phạt siêu âm (R_us=0.50), ép d = d_cam</text>

    <text x="440" y="405" font-size="11" font-weight="600" fill="#fca5a5">KB 3: Vách kính trong suốt (z_us &lt; 2m, không BBox)</text>
    <text x="735" y="405" font-size="10" fill="#f1f5f9">→ Tạo Track ảo -1, ngắt khẩn cấp</text>

    <text x="440" y="425" font-size="11" font-weight="600" fill="#bae6fd">KB 4: Đa vật trong chùm (≥ 2 tracks)</text>
    <text x="665" y="425" font-size="10" fill="#f1f5f9">→ Vật gần nhất nhận echo, vật sau dùng d_cam × s</text>
  </g>

  <!-- Mũi tên hội tụ vào Bộ lọc Kalman -->
  <path d="M 230 372 L 230 460 L 440 460 L 440 475" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 650 440 L 650 475" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-gr)"/>

  <!-- ================= 4. BỘ LỌC KALMAN DWNA DẠNG JOSEPH ================= -->
  <g filter="url(#f-shadow)">
    <rect x="230" y="475" width="540" height="74" rx="10" fill="url(#gf-kf)" stroke="#34d399" stroke-width="1.5"/>
    <text x="500" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">BỘ LỌC KALMAN 2 TRẠNG THÁI [d, ḋ] DẠNG JOSEPH</text>
    <text x="500" y="516" text-anchor="middle" font-size="11" fill="#d1fae5">1. Khử nhiễu giật, cập nhật Joseph toàn phương: P = (I-KH)P(I-KH)ᵀ + KRKᵀ (P &gt; 0)</text>
    <text x="500" y="532" text-anchor="middle" font-size="11" fill="#d1fae5">2. Ước tính vận tốc tiếp cận ḋ (m/s) → Tính thời gian va chạm động TTC = d / -ḋ</text>
  </g>

  <!-- Khối Tự học Thang đo Trực tuyến (Phụ trợ bên cạnh) -->
  <g filter="url(#f-shadow)">
    <rect x="790" y="475" width="170" height="74" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="875" y="498" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">TỰ HỌC THANG ĐO s</text>
    <text x="875" y="516" text-anchor="middle" font-size="10" fill="#fde68a">s_k = (1-α)s + α(z_us/d_cam)</text>
    <text x="875" y="532" text-anchor="middle" font-size="10" fill="#cbd5e1">Bù trừ độ cao người đeo</text>
  </g>
  <!-- Mũi tên từ KB1 sang Thang đo và ngược lại -->
  <path d="M 880 390 L 920 390 L 920 475" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-a)"/>
  <path d="M 875 549 L 875 580 L 110 580 L 110 372" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-a)"/>

  <!-- Mũi tên từ Kalman xuống Output -->
  <path d="M 500 549 L 500 585" fill="none" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arr-gr)"/>

  <!-- ================= 5. ĐẦU RA KẾT QUẢ HỢP NHẤT ================= -->
  <g filter="url(#f-shadow)">
    <rect x="250" y="585" width="500" height="65" rx="10" fill="url(#gf-out)" stroke="#2dd4bf" stroke-width="2"/>
    <text x="500" y="610" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">KẾT QUẢ HỢP NHẤT CẢM BIẾN (FUSED RESULTS)</text>
    <text x="500" y="629" text-anchor="middle" font-size="11" fill="#ccfbf1">• Cự ly d mượt mà (MAE = 0.09m) • Vận tốc ḋ • TTC (giây) • Phân làn Trái/Giữa/Phải</text>
    <text x="500" y="643" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Chuyển sang Trụ Cột 4: Tính Risk Score &amp; Ngắt Khẩn Cấp &lt; 30ms</text>
  </g>
</svg>
